name: Verify reporting lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fieldbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m lab.report
      - run: python -m pip install uv==0.8.20
      - run: uv sync --frozen
      - run: uv run --frozen --offline python -m lab.check_mcp
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run the packaged service from a real timer on this disposable VM
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --user-group fieldbook
          sudo install -d -m 755 /opt/workflow-fieldbook/lab /etc/fieldbook
          sudo install -m 644 lab/*.py /opt/workflow-fieldbook/lab/
          sudo install -d -o fieldbook -g fieldbook -m 700 /var/lib/fieldbook-north/inbox
          sudo install -o fieldbook -g fieldbook -m 600 fixtures/dealer-month.json /var/lib/fieldbook-north/inbox/month.json
          echo REPORT_PERIOD=2026-09 | sudo tee /etc/fieldbook/north-store.env >/dev/null
          sudo install -m 644 ops/fieldbook-report.{service,timer} /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/fieldbook-report.{service,timer}
          sudo install -d /etc/systemd/system/fieldbook-report.timer.d
          printf '%s\n' '[Timer]' 'OnCalendar=' 'OnActiveSec=2s' 'AccuracySec=1s' 'Persistent=false' |
            sudo tee /etc/systemd/system/fieldbook-report.timer.d/rehearsal.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start fieldbook-report.timer
          for _ in {1..25}; do
            if sudo journalctl -b -u fieldbook-report.service -o cat | grep -Fq '"created": true'; then break; fi
            sleep 1
          done
          sudo journalctl -b -u fieldbook-report.service -o cat
          sudo journalctl -b -u fieldbook-report.service -o cat | grep -F '"created": true'
          sudo systemctl start fieldbook-report.service
          sudo journalctl -b -u fieldbook-report.service -o cat | grep -F '"created": false'
