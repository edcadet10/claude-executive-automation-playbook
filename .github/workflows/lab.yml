name: Verify reporting lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m lab.report
      - run: python -m pip install uv==0.8.20
      - run: uv sync --frozen
      - run: uv run --frozen --offline python -m lab.check_mcp
